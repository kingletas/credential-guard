name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: make check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A pre-commit hook runs on whatever Python a contributor already has,
        # so the oldest supported version is tested alongside the newest.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # make lint skips shellcheck when it is missing, so it is installed here.
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: make check
        run: make check

  macos:
    name: make check (macOS, on request)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # macOS ships BSD find and xargs, which the hook and watch both call.
      - name: make check
        run: make check

  dogfood:
    name: Scan this repository's own history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The tests hold specimen keys as data, so this checks that the history
      # scan runs and reports, not that it comes back clean.
      - name: History scan produces a report
        run: |
          set -uo pipefail
          bin/credential-guard history . > report.txt 2>&1
          status=$?
          grep -q "blob(s)" report.txt || { echo "history scan produced no blob count"; exit 1; }
          echo "history scan walked the repository (exit $status)"
